[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sift"
version = "1.0.0"
description = "Full-text search engine with BM25 ranking, phrase queries and an instant-search web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vinodhini" }]
dependencies = []

[project.scripts]
sift = "sift.__main__:main"

[tool.setuptools]
packages = ["sift"]

[tool.setuptools.package-data]
sift = ["static/*.html"]
